name: Build sync manifest

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'lua/examples/**'
      - 'lua/scripts/**'
      - 'archives/**'
      - 'ipa/**'
      - '.github/workflows/build-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build manifest.json
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, time, urllib.parse

          ROOT = Path('.')
          REPO = 'thttd94/XXTE-Library'
          BRANCH = 'main'
          BASE_RAW = f'https://raw.githubusercontent.com/{REPO}/{BRANCH}'
          DIRS = ['lib', 'lua/examples', 'lua/scripts', 'archives', 'ipa']
          EXCLUDE = {
              'lua/scripts/sync_library.lua',
              'lua/scripts/sync_library.xxt',
              'lib/sync_library.lua',
              'lib/sync_library.xxt',
          }
          items = []
          for d in DIRS:
              base = ROOT / d
              if not base.exists():
                  continue
              for p in sorted(base.rglob('*')):
                  if not p.is_file():
                      continue
                  rel = p.relative_to(ROOT).as_posix()
                  rel_lower = rel.lower()
                  if rel.endswith('/.gitkeep') or rel.endswith('.gitkeep'):
                      continue
                  if rel_lower in EXCLUDE:
                      continue
                  data = p.read_bytes()
                  items.append({
                      'rel': rel,
                      'dest': '/var/mobile/Media/1ferver/' + rel,
                      'url': BASE_RAW + '/' + urllib.parse.quote(rel, safe='/'),
                      'size': len(data),
                      'sha1': hashlib.sha1(data).hexdigest(),
                  })

          out = {
              'repo': REPO,
              'branch': BRANCH,
              'generated_at': int(time.time()),
              'base_raw': BASE_RAW,
              'files': items,
          }
          Path('manifest.json').write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('manifest files:', len(items))

      - name: Commit manifest if changed
        shell: bash
        run: |
          if git diff --quiet manifest.json; then
            echo "manifest.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "auto update sync manifest"
          git push
